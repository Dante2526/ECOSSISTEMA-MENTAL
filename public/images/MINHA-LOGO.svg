<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Sombra suave para o cartão branco e personagem -->
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#8a3d00" flood-opacity="0.45" />
    </filter>
    <filter id="personShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="8" stdDeviation="6" flood-color="#7c3500" flood-opacity="0.4" />
    </filter>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#f28500" />
    </linearGradient>
  </defs>

  <!-- Fundo Circular Laranja -->
  <circle cx="400" cy="400" r="400" fill="url(#orangeGrad)" />

  <!-- Caixa de Check Esquerda (onde o braço apoia) -->
  <g transform="translate(46, 260)">
    <rect x="0" y="0" width="118" height="44" rx="6" fill="none" stroke="#111827" stroke-width="6.5" />
    <path d="M 28 19 L 48 37 L 95 -6" fill="none" stroke="#0044ff" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Personagem Sentado -->
  <g filter="url(#personShadow)">
    <!-- Fios de cabelo / detalhe superior da cabeça -->
    <path d="M 192 155 C 180 128, 208 118, 222 108 C 238 94, 265 98, 282 126 C 292 142, 296 155, 294 162" fill="none" stroke="#64748b" stroke-width="5.5" stroke-linecap="round" />
    <path d="M 196 164 C 204 169, 214 169, 219 164" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" />

    <!-- Cabeça Azul -->
    <circle cx="235" cy="184" r="44" fill="#0048ff" />

    <!-- Rosto sutil -->
    <line x1="222" y1="178" x2="230" y2="178" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" />
    <line x1="244" y1="178" x2="252" y2="178" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 237 180 L 234 192 L 240 193" fill="none" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 233 201 Q 239 205 245 201" fill="none" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />

    <!-- Tronco Escuro -->
    <path d="M 218 238 L 246 238 C 276 238, 294 256, 300 288 L 312 365 L 194 365 Z" fill="#232738" />

    <!-- Pernas Sentadas na Borda do Cartão -->
    <!-- Perna Esquerda -->
    <path d="M 156 346 L 210 346 L 210 374 L 180 374 L 180 448 L 156 448 Z" fill="#232738" />
    <!-- Perna Direita -->
    <path d="M 196 346 L 238 346 L 238 448 L 200 448 L 200 374 L 196 374 Z" fill="#232738" />

    <!-- Braço Azul Estendido -->
    <path d="M 250 268 L 146 312" fill="none" stroke="#0048ff" stroke-width="24" stroke-linecap="square" />
  </g>

  <!-- Cartão Branco Principal (Kaizen) -->
  <g filter="url(#cardShadow)">
    <rect x="192" y="362" width="465" height="292" rx="12" fill="#ffffff" />

    <!-- Recorte das pernas sentadas sobre o topo esquerdo do cartão -->
    <rect x="198" y="356" width="24" height="92" fill="#232738" />

    <!-- Duas Barras Cinzas Superiores -->
    <rect x="245" y="388" width="290" height="15" rx="6" fill="#9ca3af" />
    <rect x="245" y="416" width="290" height="15" rx="6" fill="#9ca3af" />

    <!-- 4 Círculos Coloridos à Direita -->
    <circle cx="585" cy="396" r="18" fill="#16c60c" />
    <circle cx="585" cy="442" r="18" fill="#e81123" />
    <circle cx="585" cy="488" r="18" fill="#0048ff" />
    <circle cx="585" cy="534" r="18" fill="#8800ff" />

    <!-- Texto Principal: KAIZEN -->
    <text x="234" y="518" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="900" fill="#0051ff" letter-spacing="3">KAIZEN</text>

    <!-- Faixa Preta: POR: NAYLAN -->
    <rect x="232" y="524" width="260" height="44" rx="4" fill="#09090b" />
    <text x="362" y="555" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="29" font-weight="900" fill="#ff9500" letter-spacing="1.5">POR: NAYLAN</text>

    <!-- Caixa de Check Inferior Direita -->
    <g transform="translate(546, 588)">
      <path d="M 4 8 L 4 0 L 66 0" fill="none" stroke="#111827" stroke-width="4.5" stroke-linecap="round" />
      <line x1="76" y1="14" x2="76" y2="28" stroke="#111827" stroke-width="4.5" stroke-linecap="round" />
      <path d="M 22 10 L 36 22 L 68 -4" fill="none" stroke="#0048ff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
      <ellipse cx="40" cy="40" rx="52" ry="3.5" fill="#cbd5e1" />
    </g>
  </g>
</svg>
